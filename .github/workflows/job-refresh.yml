name: Refresh campus jobs

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/job-refresh.yml'
      - 'scripts/job-discovery/**'
      - 'scripts/refresh-jobs.mjs'
      - 'scripts/refresh-jobs-scoped.mjs'
      - 'config/search-profile.json'
      - 'config/official-sources.json'
      - 'config/university-sources.json'
      - 'package.json'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install discovery runtime
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Refresh jobs
        run: npm run refresh:jobs
      - name: Validate
        run: npm run check
      - name: Commit refreshed job pool and source health
        shell: bash
        run: |
          if git diff --quiet -- src/data/live-jobs.js src/data/source-health.js; then
            echo "No job/source-health data changes."
            exit 0
          fi

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main advanced while this refresh was running; skip stale data push."
            echo "The newer main push will run a fresh discovery pass with the latest configuration."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/live-jobs.js src/data/source-health.js package-lock.json
          git commit -m "data: refresh 2027 campus jobs and source health"
          git push
