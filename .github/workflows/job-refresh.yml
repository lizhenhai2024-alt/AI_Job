name: Refresh campus jobs

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/job-refresh.yml'
      - 'scripts/job-discovery/**'
      - 'scripts/refresh-jobs.mjs'
      - 'scripts/refresh-jobs-scoped.mjs'
      - 'scripts/enrich-job-compensation.mjs'
      - 'src/core/compensation.js'
      - 'config/search-profile.json'
      - 'config/official-sources.json'
      - 'config/university-sources.json'
      - 'package.json'

concurrency:
  group: refresh-campus-jobs-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install discovery runtime
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Refresh jobs
        run: npm run refresh:jobs
      - name: Verify compensation enrichment
        run: node -e "import('./src/data/live-jobs.js').then(m=>{const s=m.discoveryMeta&&m.discoveryMeta.stats&&m.discoveryMeta.stats.compensation;if(!s||typeof s.disclosed!=='number'||s.disclosed<1){console.error('[compensation-check] FAIL: stats.compensation missing or disclosed<1: '+JSON.stringify(s));process.exit(1)}console.log('[compensation-check] OK disclosed='+s.disclosed+'/'+s.totalJobs+' official='+s.officialDisclosed)})"
      - name: Validate
        run: npm run check
      - name: Commit refreshed job pool and source health
        shell: bash
        run: |
          if git diff --quiet -- src/data/live-jobs.js src/data/source-health.js package-lock.json; then
            echo "No job/source-health data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/live-jobs.js src/data/source-health.js package-lock.json
          git commit -m "data: refresh 2027 campus jobs and source health"

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            changed_paths="$(git diff --name-only "$GITHUB_SHA"..origin/main)"
            echo "main advanced while refresh was running:"
            echo "$changed_paths"

            if echo "$changed_paths" | grep -Eq '^(.github/workflows/job-refresh\.yml|scripts/job-discovery/|scripts/refresh-jobs\.mjs|scripts/refresh-jobs-scoped\.mjs|scripts/enrich-job-compensation\.mjs|src/core/compensation\.js|config/search-profile\.json|config/official-sources\.json|config/university-sources\.json|package\.json|src/data/live-jobs\.js|src/data/source-health\.js)$'; then
              echo "Refresh inputs or generated data changed on newer main; skip stale data push."
              echo "A newer refresh run should own the next snapshot."
              exit 0
            fi

            echo "Only unrelated files changed; rebase refreshed data onto latest main."
            git rebase origin/main
          fi

          git push
