name: Refresh campus jobs

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/job-refresh.yml'
      - 'scripts/job-discovery/**'
      - 'scripts/refresh-jobs.mjs'
      - 'config/search-profile.json'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh jobs
        run: npm run refresh:jobs
      - name: Validate
        run: npm run check
      - name: Commit refreshed job pool
        shell: bash
        run: |
          if git diff --quiet -- src/data/live-jobs.js; then
            echo "No job data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/live-jobs.js
          git commit -m "data: refresh 2027 campus jobs"
          git push
