name: Probe NIO 2027 campaign

on:
  push:
    branches: [probe/nio-2027-campaign]
    paths:
      - 'scripts/probe-nio-feishu.mjs'
      - '.github/workflows/nio-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe NIO Feishu metadata
        run: node scripts/probe-nio-feishu.mjs
