name: Enrich job intelligence now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enrich-job-intelligence-now.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enrich current live pool
        run: |
          node scripts/enrich-job-compensation.mjs
          node scripts/check-compensation.mjs
          node --test src/core/headcount.test.js
      - name: Commit enriched live pool
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/live-jobs.js
          if git diff --cached --quiet; then
            echo "No live-pool changes to commit."
            exit 0
          fi
          git commit -m "data: enrich live jobs with publication HC and salary intelligence"
          git pull --rebase origin main
          git push origin main
