name: Analyze complete JDs now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-complete-jds-now.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Analyze complete JDs
        run: node scripts/enrich-jd-evidence.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JD_EVIDENCE_API_KEY: ${{ secrets.JD_EVIDENCE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          JD_EVIDENCE_PROVIDER_ORDER: gemini-free,gemini-free-31,gemini-free-25,deepseek
          JD_EVIDENCE_COMPLETE_ONLY: 1
          JD_EVIDENCE_MIN_SECTION_CHARS: 40
          JD_EVIDENCE_MIN_TOTAL_CHARS: 120
          JD_EVIDENCE_ONLY_WEAK: 0
          JD_EVIDENCE_MAX_CALLS: 1500
          JD_EVIDENCE_PAID_MAX_CALLS: 200
          JD_EVIDENCE_CONCURRENCY: 4
      - name: Report coverage
        run: node scripts/report-jd-evidence-coverage.mjs
        env:
          GEMINI_KEY_CONFIGURED: ${{ secrets.GEMINI_API_KEY != '' }}
          DEEPSEEK_KEY_CONFIGURED: ${{ secrets.JD_EVIDENCE_API_KEY != '' || secrets.DEEPSEEK_API_KEY != '' }}
      - name: Commit AI evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/live-jobs.js
          if [ -f src/data/jd-evidence-cache.json ]; then git add src/data/jd-evidence-cache.json; fi
          if git diff --cached --quiet; then
            echo 'No JD evidence changes.'
            exit 0
          fi
          git commit -m 'data: analyze complete JDs with AI evidence'
          git pull --rebase origin main
          git push
