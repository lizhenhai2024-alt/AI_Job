name: Refresh campus jobs

on:
  schedule:
    - cron: '0 22 * * *'      # 06:00 Asia/Shanghai
    - cron: '0 9 * * *'       # 17:00 Asia/Shanghai
    - cron: '30 14 * * *'     # 22:30 Asia/Shanghai，补抓晚间高校新增
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-campus-jobs.yml'
      - 'scripts/job-discovery/**'
      - 'scripts/refresh-jobs.mjs'
      - 'scripts/refresh-jobs-scoped.mjs'
      - 'scripts/filter-official-live-jobs.mjs'
      - 'scripts/enrich-job-compensation.mjs'
      - 'scripts/check-compensation.mjs'
      - 'src/core/compensation.js'
      - 'src/core/headcount.js'
      - 'config/search-profile.json'
      - 'config/official-sources.json'
      - 'config/university-sources.json'
      - 'config/source-discovery.json'
      - 'config/company-requests.json'
      - 'package.json'

concurrency:
  group: refresh-campus-jobs-main-v2
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 2026-09-16实测：官方源+高校桥接本身可接近25分钟。LLM已拆出，
    # 这里仍留35分钟余量，避免核心数据在最后提交前被平台超时杀掉。
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install discovery runtime
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Refresh core job snapshot
        run: npm run refresh:jobs
        env:
          # 核心岗位快照必须先稳定落盘。大批量LLM事实富化由独立
          # Analyze complete JDs工作流承担，API限流/配额不得阻塞岗位刷新。
          SKIP_JD_EVIDENCE: 1
      - name: Report existing JD evidence coverage
        run: node scripts/report-jd-evidence-coverage.mjs
        env:
          # 只传“是否配置”的布尔值，不把Secret交给统计步骤。
          OPENCODE_ZEN_KEY_CONFIGURED: ${{ secrets.OPENCODE_ZEN_API_KEY != '' }}
          GEMINI_KEY_CONFIGURED: ${{ secrets.GEMINI_API_KEY != '' }}
          DEEPSEEK_KEY_CONFIGURED: ${{ secrets.JD_EVIDENCE_API_KEY != '' || secrets.DEEPSEEK_API_KEY != '' }}
      - name: Verify job intelligence enrichment
        run: node scripts/check-compensation.mjs
      - name: Rebuild source registry
        run: npm run build:source-registry
      - name: Rebuild company requests module
        run: npm run build:company-requests
      - name: Rebuild source discovery module
        run: npm run build:source-discovery
      - name: Validate
        run: npm run check
      - name: Commit refreshed job pool and source health
        shell: bash
        run: |
          TRACKED_PATHS=(
            src/data/live-jobs.js
            src/data/source-health.js
            src/data/source-registry.js
            src/data/company-requests.js
            src/data/source-discovery.js
            config/official-sources.json
            config/source-discovery.json
            config/company-requests.json
            package-lock.json
          )
          ACTIVE_PATHS=()
          for path in "${TRACKED_PATHS[@]}"; do
            if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              ACTIVE_PATHS+=("$path")
            fi
          done

          if git diff --quiet -- "${ACTIVE_PATHS[@]}"; then
            echo "No job/source-health/source-bridge data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${ACTIVE_PATHS[@]}"
          git commit -m "data: refresh 2027 campus jobs and university source bridge"

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            changed_paths="$(git diff --name-only "$GITHUB_SHA"..origin/main)"
            echo "main advanced while refresh was running:"
            echo "$changed_paths"

            if echo "$changed_paths" | grep -Eq '^(.github/workflows/refresh-campus-jobs\.yml|scripts/job-discovery/|scripts/refresh-jobs\.mjs|scripts/refresh-jobs-scoped\.mjs|scripts/filter-official-live-jobs\.mjs|scripts/enrich-job-compensation\.mjs|src/core/compensation\.js|src/core/headcount\.js|config/search-profile\.json|config/official-sources\.json|config/university-sources\.json|config/source-discovery\.json|config/company-requests\.json|package\.json|src/data/live-jobs\.js|src/data/source-health\.js)$'; then
              echo "Refresh inputs or generated data changed on newer main; skip stale data push."
              echo "A newer refresh run should own the next snapshot."
              exit 0
            fi

            echo "Only unrelated files changed; rebase refreshed data onto latest main."
            git rebase origin/main
          fi

          git push
