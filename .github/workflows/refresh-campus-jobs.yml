name: Refresh campus jobs

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 9 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-campus-jobs.yml'
      - 'scripts/job-discovery/**'
      - 'scripts/refresh-jobs.mjs'
      - 'scripts/refresh-jobs-scoped.mjs'
      - 'scripts/build-query-layer.mjs'
      - 'scripts/filter-official-live-jobs.mjs'
      - 'scripts/enrich-job-compensation.mjs'
      - 'scripts/check-compensation.mjs'
      - 'src/core/compensation.js'
      - 'src/core/headcount.js'
      - 'config/search-profile.json'
      - 'config/official-sources.json'
      - 'config/university-sources.json'
      - 'config/source-discovery.json'
      - 'config/company-requests.json'
      - 'scripts/enrich-jd-evidence.mjs'
      - 'scripts/report-jd-evidence-coverage.mjs'
      - 'src/data/jd-evidence-cache.json'
      - 'package.json'

concurrency:
  group: refresh-campus-jobs-main-v2
  # Do not cancel an in-flight refresh when source-discovery pushes a newer main commit.
  # Cancelling here used to strand the pipeline before validation/query-layer commit.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install discovery runtime
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Refresh jobs and query layer
        run: npm run refresh:jobs
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JD_EVIDENCE_API_KEY: ${{ secrets.JD_EVIDENCE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          JD_EVIDENCE_PROVIDER_ORDER: gemini-free,gemini-free-31,gemini-free-25,deepseek
          JD_EVIDENCE_MAX_CALLS: 1500
          JD_EVIDENCE_PAID_MAX_CALLS: 200
          JD_EVIDENCE_CONCURRENCY: 4
          JD_EVIDENCE_COMPLETE_ONLY: 1
          JD_EVIDENCE_MIN_SECTION_CHARS: 40
          JD_EVIDENCE_MIN_TOTAL_CHARS: 120
          JD_EVIDENCE_ONLY_WEAK: 0
      - name: Report JD evidence coverage
        run: node scripts/report-jd-evidence-coverage.mjs
        env:
          OPENCODE_ZEN_KEY_CONFIGURED: ${{ secrets.OPENCODE_ZEN_API_KEY != '' }}
          GEMINI_KEY_CONFIGURED: ${{ secrets.GEMINI_API_KEY != '' }}
          DEEPSEEK_KEY_CONFIGURED: ${{ secrets.JD_EVIDENCE_API_KEY != '' || secrets.DEEPSEEK_API_KEY != '' }}
      - name: Verify job intelligence enrichment
        run: node scripts/check-compensation.mjs
      - name: Rebuild source registry
        run: npm run build:source-registry
      - name: Rebuild company requests module
        run: npm run build:company-requests
      - name: Rebuild source discovery module
        run: npm run build:source-discovery
      - name: Validate
        run: npm run check
      - name: Verify complete query layer
        shell: bash
        run: |
          test -s jobs/index/companies.json
          test -s jobs/index/jobs.json
          test -s jobs/index/careerpilot-feed.json
          node - <<'NODE'
          const fs=require('fs');
          const companies=JSON.parse(fs.readFileSync('jobs/index/companies.json','utf8'));
          const jobs=JSON.parse(fs.readFileSync('jobs/index/jobs.json','utf8'));
          const feed=JSON.parse(fs.readFileSync('jobs/index/careerpilot-feed.json','utf8'));
          if(!companies.totalJobs || !companies.totalCompanies || companies.companies.length!==companies.totalCompanies) throw new Error('invalid companies manifest');
          if(!Array.isArray(jobs.jobs) || jobs.totalJobs!==jobs.jobs.length || jobs.totalJobs!==companies.totalJobs) throw new Error('aggregate query index mismatch');
          if(!Array.isArray(feed.jobs) || feed.totalJobs!==feed.jobs.length || feed.totalJobs!==companies.totalJobs) throw new Error('careerpilot feed mismatch');
          if(feed.jobs.some(j => 'JD' in j || 'jobDescription' in j || 'jobRequirements' in j)) throw new Error('careerpilot feed must stay lightweight');
          console.log('query-layer', jobs.totalJobs, companies.totalCompanies, 'careerpilot-feed', feed.totalJobs);
          NODE
      - name: Commit refreshed job pool, source health and query layer
        shell: bash
        run: |
          TRACKED_PATHS=(
            src/data/live-jobs.js
            src/data/source-health.js
            src/data/source-registry.js
            src/data/company-requests.js
            src/data/source-discovery.js
            src/data/jd-evidence-cache.json
            config/official-sources.json
            config/source-discovery.json
            config/company-requests.json
            package-lock.json
            jobs/index/companies.json
            jobs/index/jobs.json
            jobs/index/careerpilot-feed.json
            jobs/by-company
          )
          ACTIVE_PATHS=()
          for path in "${TRACKED_PATHS[@]}"; do
            if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              ACTIVE_PATHS+=("$path")
            fi
          done

          if [ -z "$(git status --porcelain -- "${ACTIVE_PATHS[@]}")" ]; then
            echo "No job/source-health/query-layer data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${ACTIVE_PATHS[@]}"
          git commit -m "data: refresh 2027 campus jobs and query layer"

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            changed_paths="$(git diff --name-only "$GITHUB_SHA"..origin/main)"
            echo "main advanced while refresh was running:"
            echo "$changed_paths"

            if echo "$changed_paths" | grep -Eq '^(.github/workflows/refresh-campus-jobs\.yml|scripts/job-discovery/|scripts/refresh-jobs\.mjs|scripts/refresh-jobs-scoped\.mjs|scripts/build-query-layer\.mjs|scripts/filter-official-live-jobs\.mjs|scripts/enrich-job-compensation\.mjs|scripts/enrich-jd-evidence\.mjs|scripts/report-jd-evidence-coverage\.mjs|src/core/compensation\.js|src/core/headcount\.js|config/search-profile\.json|config/official-sources\.json|config/university-sources\.json|config/source-discovery\.json|config/company-requests\.json|package\.json|src/data/live-jobs\.js|src/data/source-health\.js|src/data/jd-evidence-cache\.json|jobs/)'; then
              echo "Refresh inputs or generated data changed on newer main; skip stale data push."
              echo "A newer refresh run should own the next snapshot."
              exit 0
            fi

            echo "Only unrelated files changed; rebase refreshed data onto latest main."
            git rebase origin/main
          fi

          git push
