name: Refresh campus jobs

on:
  schedule:
    - cron: '0 22 * * *'      # 06:00 Asia/Shanghai
    - cron: '0 9 * * *'       # 17:00 Asia/Shanghai
    - cron: '30 14 * * *'     # 22:30 Asia/Shanghai，补抓晚间高校新增
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-campus-jobs.yml'
      - 'scripts/job-discovery/**'
      - 'scripts/refresh-jobs.mjs'
      - 'scripts/refresh-jobs-scoped.mjs'
      - 'scripts/filter-official-live-jobs.mjs'
      - 'scripts/enrich-job-compensation.mjs'
      - 'scripts/check-compensation.mjs'
      - 'src/core/compensation.js'
      - 'src/core/headcount.js'
      - 'config/search-profile.json'
      - 'config/official-sources.json'
      - 'config/university-sources.json'
      - 'config/source-discovery.json'
      - 'config/company-requests.json'
      - 'scripts/enrich-jd-evidence.mjs'
      - 'scripts/report-jd-evidence-coverage.mjs'
      - 'src/data/jd-evidence-cache.json'
      - 'package.json'

concurrency:
  group: refresh-campus-jobs-main-v2
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install discovery runtime
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Refresh jobs
        run: npm run refresh:jobs
        env:
          # JD Evidence：Gemini Free Tier 多模型优先，DeepSeek Flash（非推理）只做付费兜底。
          # OpenCode Zen free 在 headless API 实测返回 MissingSessionID，当前不进入生产顺序。
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 推荐 Secret 名 JD_EVIDENCE_API_KEY；同时兼容 DEEPSEEK_API_KEY。
          JD_EVIDENCE_API_KEY: ${{ secrets.JD_EVIDENCE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          JD_EVIDENCE_PROVIDER_ORDER: gemini-free,gemini-free-31,gemini-free-25,deepseek
          # 单轮最多处理 1500 个完整 JD。三个 Gemini 免费模型都失败时，
          # DeepSeek 最多兜底 200 条，避免免费层故障时把整批流量切到付费 API。
          JD_EVIDENCE_MAX_CALLS: 1500
          JD_EVIDENCE_PAID_MAX_CALLS: 200
          JD_EVIDENCE_CONCURRENCY: 4
          # 仅分析“岗位说明 + 任职要求”都完整的 JD；完整 JD 全部做 AI 事实分析。
          JD_EVIDENCE_COMPLETE_ONLY: 1
          JD_EVIDENCE_MIN_SECTION_CHARS: 40
          JD_EVIDENCE_MIN_TOTAL_CHARS: 120
          JD_EVIDENCE_ONLY_WEAK: 0
      - name: Report JD evidence coverage
        run: node scripts/report-jd-evidence-coverage.mjs
        env:
          # 只传“是否配置”的布尔值，不把 Secret 交给统计步骤。
          OPENCODE_ZEN_KEY_CONFIGURED: ${{ secrets.OPENCODE_ZEN_API_KEY != '' }}
          GEMINI_KEY_CONFIGURED: ${{ secrets.GEMINI_API_KEY != '' }}
          DEEPSEEK_KEY_CONFIGURED: ${{ secrets.JD_EVIDENCE_API_KEY != '' || secrets.DEEPSEEK_API_KEY != '' }}
      - name: Verify job intelligence enrichment
        run: node scripts/check-compensation.mjs
      - name: Rebuild source registry
        run: npm run build:source-registry
      - name: Rebuild company requests module
        run: npm run build:company-requests
      - name: Rebuild source discovery module
        run: npm run build:source-discovery
      - name: Validate
        run: npm run check
      - name: Commit refreshed job pool and source health
        shell: bash
        run: |
          TRACKED_PATHS=(
            src/data/live-jobs.js
            src/data/source-health.js
            src/data/source-registry.js
            src/data/company-requests.js
            src/data/source-discovery.js
            src/data/jd-evidence-cache.json
            config/official-sources.json
            config/source-discovery.json
            config/company-requests.json
            package-lock.json
          )
          ACTIVE_PATHS=()
          for path in "${TRACKED_PATHS[@]}"; do
            if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              ACTIVE_PATHS+=("$path")
            fi
          done

          if git diff --quiet -- "${ACTIVE_PATHS[@]}"; then
            echo "No job/source-health/source-bridge data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${ACTIVE_PATHS[@]}"
          git commit -m "data: refresh 2027 campus jobs and university source bridge"

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            changed_paths="$(git diff --name-only "$GITHUB_SHA"..origin/main)"
            echo "main advanced while refresh was running:"
            echo "$changed_paths"

            if echo "$changed_paths" | grep -Eq '^(.github/workflows/refresh-campus-jobs\.yml|scripts/job-discovery/|scripts/refresh-jobs\.mjs|scripts/refresh-jobs-scoped\.mjs|scripts/filter-official-live-jobs\.mjs|scripts/enrich-job-compensation\.mjs|scripts/enrich-jd-evidence\.mjs|scripts/report-jd-evidence-coverage\.mjs|src/core/compensation\.js|src/core/headcount\.js|config/search-profile\.json|config/official-sources\.json|config/university-sources\.json|config/source-discovery\.json|config/company-requests\.json|package\.json|src/data/live-jobs\.js|src/data/source-health\.js|src/data/jd-evidence-cache\.json)$'; then
              echo "Refresh inputs or generated data changed on newer main; skip stale data push."
              echo "A newer refresh run should own the next snapshot."
              exit 0
            fi

            echo "Only unrelated files changed; rebase refreshed data onto latest main."
            git rebase origin/main
          fi

          git push
