name: Refresh campus jobs

on:
  schedule:
    - cron: '0 22 * * *'      # 06:00 Asia/Shanghai
    - cron: '0 9 * * *'       # 17:00 Asia/Shanghai
    - cron: '30 14 * * *'     # 22:30 Asia/Shanghai，补抓晚间高校新增
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-campus-jobs.yml'
      - 'scripts/job-discovery/**'
      - 'scripts/refresh-jobs.mjs'
      - 'scripts/refresh-jobs-scoped.mjs'
      - 'scripts/filter-official-live-jobs.mjs'
      - 'scripts/enrich-job-compensation.mjs'
      - 'scripts/check-compensation.mjs'
      - 'src/core/**'
      - 'config/search-profile.json'
      - 'config/official-sources.json'
      - 'config/university-sources.json'
      - 'config/source-discovery.json'
      - 'config/company-requests.json'
      # The registry/requests/discovery modules are rebuilt and committed by this
      # job, so their generators and inputs must trigger it too — otherwise a
      # change to a generator leaves the committed module stale until the next cron.
      - 'scripts/build-source-registry.mjs'
      - 'scripts/build-company-requests.mjs'
      - 'scripts/build-source-discovery.mjs'
      - 'scripts/process-company-intake.mjs'
      - 'src/data/company-registry.js'
      - 'src/data/company-source-seeds.js'
      - 'scripts/enrich-jd-evidence.mjs'
      - 'scripts/report-jd-evidence-coverage.mjs'
      - 'src/data/jd-evidence-cache.json'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: refresh-campus-jobs-main-v2
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install discovery runtime
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Refresh jobs
        run: npm run refresh:jobs
        env:
          # 管线第 4.5 步（enrich-jd-evidence）用这个 key 调 LLM 抽取 JD 事实。
          # 未配置 secret 时求值为空字符串，该步骤自行跳过并返回 0，刷新不受影响。
          JD_EVIDENCE_API_KEY: ${{ secrets.JD_EVIDENCE_API_KEY }}
          # 单轮调用上限 + 并发。实测 deepseek-flash + 关推理约 0.87s/条、¥0.0060/条，
          # 1500 条 / 并发 4 ≈ 5.5 分钟（CI 超时 25 分钟），单轮花费约 ¥9。
          # 回填完后每轮只处理新增/变更岗位（缓存按 JD 哈希跳过）。
          JD_EVIDENCE_MAX_CALLS: 1500
          JD_EVIDENCE_CONCURRENCY: 4
          # 默认只补"本仓库正则抽不到专业原文"的岗位（实测 37.9%）。
          # 设为 0 会对所有有正文的岗位跑一遍，成本约 2.6 倍。
          JD_EVIDENCE_ONLY_WEAK: 1
          # 换抽取模型只改这一行（见 scripts/job-discovery/llm-evidence.mjs 的 MODEL_PRESETS）
          JD_EVIDENCE_PRESET: deepseek
      # 未配置 secret 时上面那步会静默跳过（设计内的降级路径），于是「配了 LLM 增强
      # 的管线」可以整月绿色通过却什么都没做。这里把覆盖率显式报告出来：
      # 未启用 → ::warning::（不中断刷新）；已配置却零产出 → ::error::（真故障）。
      # 只把「是否配置」这个布尔交给本步，密钥本身不进出。
      - name: Report JD evidence coverage
        run: node scripts/report-jd-evidence-coverage.mjs
        env:
          JD_EVIDENCE_KEY_CONFIGURED: ${{ secrets.JD_EVIDENCE_API_KEY != '' }}
      - name: Verify job intelligence enrichment
        run: node scripts/check-compensation.mjs
      - name: Rebuild source registry
        run: npm run build:source-registry
      - name: Rebuild company requests module
        run: npm run build:company-requests
      - name: Rebuild source discovery module
        run: npm run build:source-discovery
      - name: Validate
        run: npm run check
      - name: Commit refreshed job pool and source health
        shell: bash
        run: |
          TRACKED_PATHS="src/data/live-jobs.js src/data/source-health.js src/data/source-registry.js src/data/company-requests.js src/data/source-discovery.js src/data/jd-evidence-cache.json config/official-sources.json config/source-discovery.json config/company-requests.json package-lock.json"
          # The refresh always rewrites discoveryMeta.updatedAt, so a raw diff can
          # never be empty and this guard used to be unreachable. Compare the data
          # instead: strip diff headers and the timestamp line.
          DATA_DIFF="$(git diff -U0 -- $TRACKED_PATHS | grep '^[+-]' | grep -v '^[+-][+-][+-]' | grep -v '"updatedAt"')"
          if [ -z "$DATA_DIFF" ]; then
            echo "No job/source-health/source-bridge data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $TRACKED_PATHS
          git commit -m "data: refresh 2027 campus jobs and university source bridge"

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            changed_paths="$(git diff --name-only "$GITHUB_SHA"..origin/main)"
            echo "main advanced while refresh was running:"
            echo "$changed_paths"

            # Anything this job reads or writes must come from the newer main, or
            # this run would rebase its own (older) rebuild of the same file on top
            # of it. Kept in one list with TRACKED_PATHS above; the previous
            # hand-written regex silently omitted four of them.
            REFRESH_INPUTS=".github/workflows/refresh-campus-jobs.yml scripts/job-discovery scripts/refresh-jobs.mjs scripts/refresh-jobs-scoped.mjs scripts/filter-official-live-jobs.mjs scripts/enrich-job-compensation.mjs scripts/check-compensation.mjs scripts/enrich-jd-evidence.mjs scripts/report-jd-evidence-coverage.mjs scripts/build-source-registry.mjs scripts/build-company-requests.mjs scripts/build-source-discovery.mjs src/core src/data/company-registry.js src/data/company-source-seeds.js config/search-profile.json config/official-sources.json config/university-sources.json config/source-discovery.json config/company-requests.json package.json package-lock.json src/data/live-jobs.js src/data/source-health.js src/data/source-registry.js src/data/company-requests.js src/data/source-discovery.js src/data/jd-evidence-cache.json"

            stale=0
            while IFS= read -r changed; do
              [ -z "$changed" ] && continue
              for input in $REFRESH_INPUTS; do
                case "$changed" in
                  "$input"|"$input"/*) stale=1; break ;;
                esac
              done
              [ "$stale" = 1 ] && break
            done <<< "$changed_paths"

            if [ "$stale" = 1 ]; then
              echo "Refresh inputs or generated data changed on newer main; skip stale data push."
              echo "A newer refresh run should own the next snapshot."
              exit 0
            fi

            echo "Only unrelated files changed; rebase refreshed data onto latest main."
            git rebase origin/main
          fi

          git push
