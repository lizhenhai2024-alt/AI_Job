name: Foreign Phenom live probe

on:
  push:
    branches:
      - probe/phenom-foreign

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser runtime
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Probe /widgets traffic
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = await import('playwright');
          const targets = [
            ['Schneider Electric','https://careers.se.com/jobs?lang=zh-cn'],
            ['Mars China','https://careers.mars.com/cn/zh/search-results'],
            ['DHL','https://careers.dhl.com/global/en/search-results']
          ];
          const browser = await chromium.launch({headless:true});
          const clean = v => String(v ?? '').replace(/\s+/g,' ').slice(0,800);
          for (const [name,url] of targets) {
            console.log(`\n===== ${name} =====`);
            const page = await browser.newPage({viewport:{width:1365,height:900}});
            const requests = [];
            page.on('request', req => {
              if (/\/widgets(?:\?|$)/.test(req.url()) && req.method() === 'POST') {
                let body = req.postData() || '';
                let parsed; try { parsed = JSON.parse(body); } catch {}
                requests.push({url:req.url(), headers:req.headers(), body:parsed || clean(body)});
                console.log('WIDGET_REQ', JSON.stringify({url:req.url(), body:parsed || clean(body), csrf:req.headers()['x-csrf-token'] || ''}).slice(0,12000));
              }
            });
            page.on('response', async res => {
              if (/\/widgets(?:\?|$)/.test(res.url()) && res.request().method() === 'POST') {
                try {
                  const txt = await res.text();
                  let json; try { json = JSON.parse(txt); } catch {}
                  const blocks = json && typeof json === 'object' ? Object.keys(json) : [];
                  const findJobs = o => {
                    if (!o) return [];
                    if (Array.isArray(o)) { for (const x of o) { const r=findJobs(x); if(r.length) return r; } return []; }
                    if (typeof o === 'object') { if(Array.isArray(o.jobs)) return o.jobs; for(const v of Object.values(o)){ const r=findJobs(v); if(r.length) return r; } }
                    return [];
                  };
                  const jobs = findJobs(json);
                  console.log('WIDGET_RES', JSON.stringify({status:res.status(), blocks, jobs:jobs.length, sample:jobs.slice(0,3).map(j=>({title:j.title,jobId:j.jobId||j.reqId||j.id,country:j.country,city:j.city,location:j.location||j.cityStateCountry,category:j.category,postedDate:j.postedDate,applyUrl:j.applyUrl||j.jobUrl}))}).slice(0,12000));
                } catch(e) { console.log('WIDGET_RES_ERR',e.message); }
              }
            });
            try {
              const r = await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
              console.log('PAGE',r?.status(),page.url());
              await page.waitForTimeout(8000);
              await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
              await page.waitForTimeout(3000);
              const cookies = await page.context().cookies();
              const ps = cookies.find(c=>c.name==='PLAY_SESSION');
              console.log('PLAY_SESSION',ps ? `present length=${ps.value.length}` : 'none');
              console.log('WIDGET_REQUESTS',requests.length);
              console.log('TITLE',clean(await page.title()));
            } catch(e) { console.log('PAGE_ERROR',e.message); }
            await page.close();
          }
          await browser.close();
          NODE
