name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild generated source modules for validation
        run: |
          npm run build:source-registry
          npm run build:company-requests
          npm run build:source-discovery
      - name: Run checks
        run: npm run check
