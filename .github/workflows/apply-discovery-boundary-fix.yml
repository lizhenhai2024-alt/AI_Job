name: Apply discovery boundary fix

on:
  push:
    branches:
      - fix/discovery-boundary-20260916
    paths:
      - '.github/workflows/apply-discovery-boundary-fix.yml'
      - 'scripts/finalize-discovery-boundary-fix.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-discovery-boundary-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/discovery-boundary-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply final boundary patch
        run: python3 scripts/finalize-discovery-boundary-fix.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate repository
        run: npm run check
      - name: Commit validated fix and remove migration helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/job-discovery/core.mjs scripts/job-discovery/moka.mjs scripts/job-discovery/beisen.mjs scripts/job-discovery/hotjob.mjs scripts/refresh-jobs.mjs scripts/job-discovery/refresh-university-jobs.mjs tests/moka.test.js tests/beisen.test.js tests/hotjob.test.js tests/discovery-boundary.test.js
          git rm -f scripts/apply-discovery-boundary-fix.py scripts/apply-discovery-boundary-test-fix.py scripts/finalize-discovery-boundary-fix.py .github/workflows/apply-discovery-boundary-fix.yml
          git commit -m "fix(discovery): enforce discovery-only production boundary"
          git push origin HEAD:fix/discovery-boundary-20260916
