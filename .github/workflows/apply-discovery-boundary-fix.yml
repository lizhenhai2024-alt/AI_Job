name: Apply discovery boundary fix

on:
  push:
    branches:
      - fix/discovery-boundary-20260916
    paths:
      - '.github/workflows/apply-discovery-boundary-fix.yml'
      - 'scripts/apply-discovery-boundary-fix.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-discovery-boundary-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/discovery-boundary-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exact source migration
        run: python3 scripts/apply-discovery-boundary-fix.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate repository
        run: npm run check
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/job-discovery/core.mjs scripts/refresh-jobs.mjs scripts/job-discovery/refresh-university-jobs.mjs scripts/job-discovery/university-official-bridge.mjs scripts/job-discovery/granularity.mjs tests/discovery.test.js tests/granularity.test.js README.md
          if git diff --cached --quiet; then
            echo "No migration changes found."
            exit 1
          fi
          git commit -m "fix(discovery): preserve verified 2027 jobs for downstream decisions"
          git push origin HEAD:fix/discovery-boundary-20260916
