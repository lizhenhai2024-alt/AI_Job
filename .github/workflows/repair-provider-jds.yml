name: Repair provider JDs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-provider-jds.yml'
      - 'scripts/repair-provider-jds.mjs'
      - 'scripts/job-discovery/meituan.mjs'
      - 'scripts/job-discovery/xiaohongshu.mjs'
  workflow_dispatch:

concurrency:
  group: repair-provider-jds
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repair official provider snapshots
        run: node scripts/repair-provider-jds.mjs
      - name: Rebuild language, compensation and headcount intelligence
        run: node scripts/enrich-job-compensation.mjs
      - name: Validate repository
        run: npm run check
      - name: Commit repaired provider data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/live-jobs.js
          if git diff --cached --quiet; then
            echo 'No provider JD repair changes.'
            exit 0
          fi
          git commit -m 'data: repair Meituan and Xiaohongshu per-role JDs'
          git pull --rebase origin main
          git push
